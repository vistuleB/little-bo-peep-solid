<svg xmlns="http://www.w3.org/2000/svg" width="490" height="375" viewBox="0 0 490 375" role="img" aria-labelledby="title"><title id="title">Four right triangles leave a square of side c</title><g stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="100,50 360,50 360,310 100,310" fill="#edf3f5" stroke="#373b40"/><polygon points="260,50 360,210 200,310 100,150" fill="#fff" stroke="#b66a50"/><text x="180" y="33" fill="#373b40" font-size="21" text-anchor="middle">a</text><text x="310" y="33" fill="#373b40" font-size="21" text-anchor="middle">b</text><text x="384" y="134" fill="#373b40" font-size="21" text-anchor="middle">a</text><text x="384" y="271" fill="#373b40" font-size="21" text-anchor="middle">b</text><text x="280" y="339" fill="#373b40" font-size="21" text-anchor="middle">a</text><text x="150" y="339" fill="#373b40" font-size="21" text-anchor="middle">b</text><text x="78" y="240" fill="#373b40" font-size="21" text-anchor="middle">a</text><text x="78" y="105" fill="#373b40" font-size="21" text-anchor="middle">b</text><text x="231" y="191" fill="#b66a50" font-size="29" text-anchor="middle">c²</text><text x="299" y="132" fill="#b66a50" font-size="21" text-anchor="middle">c</text><text x="245" y="367" fill="#373b40" font-size="19" text-anchor="middle">outer side: a + b</text></g></svg>